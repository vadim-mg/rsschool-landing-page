<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rsschool-landing-page</title>
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>

<body class="page product-menu-page">

  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
        <span class="logo__image"></span>
      </a>
      <nav class="header__nav">
        <a href="index.html#favorite" class="header__nav__link">Favorite coffee</a>
        <a href="index.html#about" class="header__nav__link">About</a>
        <a href="index.html#mobile" class="header__nav__link">Mobile app</a>
        <a href="index.html#contacts" class="header__nav__link">Contact us</a>
      </nav>

      <div class="header__right">
        <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
          <span class="theme-toggle__option theme-toggle__option_light"></span>
          <span class="theme-toggle__option theme-toggle__option_dark"></span>
        </button>

        <button class="burger" id="burger" aria-label="Меню">
          <span class="hr"></span>
          <span class="hr"></span>
        </button>

        <a href="menu.html" class="header__nav__link menu__button" id="menu-button">
          Меню <span class="menu__button-icon"></span>
        </a>
      </div>
    </div>
  </header>

  <main class="content">

    <section class="menu">
      <div class="container">
        <div class="menu__content">
          <h1 class="page__title page__title_h1 page__title_center menu__caption">Behind each of our cups hides an <span
              class="page__title-accent">amazing surprise</span>
          </h1>
          <div class="menu-filters">
            <!-- menu-filters__button_active -->
            <button class="menu-filters__button" id="coffee-category">
              <span class="menu-filters__button-icon menu-filters__button-icon_coffee"></span>
              <span class="menu-filters__button-caption">Coffee</span>
            </button>
            <button class="menu-filters__button" id="tea-category">
              <span class="menu-filters__button-icon menu-filters__button-icon_tea"></span>
              <span class="menu-filters__button-caption">Tea</span>
            </button>
            <button class="menu-filters__button" id="dessert-category">
              <span class="menu-filters__button-icon menu-filters__button-icon_desert"></span>
              <span class="menu-filters__button-caption">Desert</span>
            </button>
          </div>
          <div class="menu-cards">
          </div>
          <button class="round-button round-button_hidden-on-desktop round-button_more"></button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__content">
        <div class="footer__content-column">
          <p class="page__title page__title_h2 footer__header">Sip, Savor, Smile. <br><span
              class="page__title-accent">It’s
              coffee
              time!</span>
          </p>
          <ul class="social-media-icons">
            <li class="social-media-item"><a href="https://twitter.com" target="_blank" class="social-media__link">
                <span class="social-media-icon social-media-icon_twitter"></span>
              </a></li>
            <li class="social-media-item"><a href="https://instagram.com" target="_blank" class="social-media__link">
                <span class="social-media-icon social-media-icon_instagram"></span>
              </a></li>
            <li class="social-media-item"><a href="https://facebook.com" target="_blank" class="social-media__link">
                <span class="social-media-icon social-media-icon_facebook"></span>
              </a></li>
          </ul>
        </div>
        <div class="footer__content-column">
          <p class="contacts__header">Contacts us</p>
          <ul class="contacts">
            <li class="contacts contacts__contact contacts_address">
              <a class="contacts__link" target="_blank" href="https://maps.google.com/?q=8558+Green+Rd,+LA">8558 Green
                Rd., LA</a>
            </li>
            <li class="contacts contacts__contact contacts_phone">
              <a class="contacts__link" href="tel:+16035550123">+1 (603) 555-0123</a>
            </li>
            <li class="contacts contacts__contact contacts_worktime">Mon–Sat: 9:00–23:00</li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <template id="menu-card-template">
    <div class="menu-card">
      <div class="menu-card__image">
        <img src="" alt="">
      </div>
      <div class="menu-card__content">
        <h2 class="menu-card__title"></h2>
        <p class="menu-card__description"></p>
        <div class="menu-card__price"></div>
      </div>
    </div>
  </template>

  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
